# Shared steps for the per-R-version workflows (R-4.0.yaml ... R-devel.yaml).
# This file does not run on its own: each R-*.yaml calls it with its R version.
# Change the steps here and every R version picks the change up.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: check-r-version

on:
  workflow_call:
    inputs:
      r-version:
        description: "R version to test, e.g. '4.4' (last 4.4.x) or 'devel'"
        type: string
        required: true
      os:
        description: "JSON list of runners to test this R version on"
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      http-user-agent:
        description: "Passed to setup-r; 'release' lets R-devel use release binaries"
        type: string
        default: ''

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (R ${{ inputs.r-version }})

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}

    env:
      GITHUB_PAT: ${{ github.token }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version }}
          http-user-agent: ${{ inputs.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        id: deps
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Install stat4omics the way a student would, then run init() and make
      # sure the extra packages it installs (currently SSPA) actually load.
      # Runs even if R CMD check failed, as long as the dependencies installed.
      - name: Test stat4omics::init()
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        shell: Rscript {0}
        run: |
          # Use a fresh library at the front of the library path, so that
          # stat4omics and everything init() installs land there and never
          # end up in the package cache that setup-r-dependencies saves.
          # Otherwise later runs would restore SSPA from the cache and
          # init() would have nothing left to install.
          lib <- file.path(tempdir(), "init-lib")
          dir.create(lib)
          .libPaths(c(lib, .libPaths()))

          if (requireNamespace("SSPA", quietly = TRUE)) {
            stop("SSPA is already installed, so init() would not be tested")
          }

          install.packages(".", repos = NULL, type = "source", lib = lib)

          stat4omics::init()

          # Fail the job if init() did not leave a working SSPA behind
          library(SSPA)
          cat("SSPA", format(packageVersion("SSPA")), "installed in",
              dirname(find.package("SSPA")), "\n")

          # Smoke test that also runs SSPA's compiled code
          set.seed(1)
          pd <- pilotData(statistics = c(rnorm(900), rnorm(100, 3)),
                          samplesize = sqrt(10), distribution = "norm")
          ss <- sampleSize(pd, method = "deconv")
          cat("SSPA works: estimated pi0 =", round(ss@pi0, 3), "\n")

# R CMD check + init() test on R 4.1 (last 4.1.x). Steps: check-r-version.yaml
name: R 4.1

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    uses: ./.github/workflows/check-r-version.yaml
    with:
      r-version: '4.1'
      # R 4.1 uses Bioconductor 3.14, which Posit's mirror no longer carries
      bioc-mirror: 'https://bioconductor.org'

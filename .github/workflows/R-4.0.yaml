# R CMD check + init() test on R 4.0 (last 4.0.x). Steps: check-r-version.yaml
name: R 4.0

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    uses: ./.github/workflows/check-r-version.yaml
    with:
      r-version: '4.0'
      # R 4.0 has no Apple Silicon build and macos-latest is Apple Silicon,
      # so macOS runs on GitHub's Intel runner (retired by GitHub in 2027).
      os: '["ubuntu-latest", "macos-15-intel", "windows-latest"]'
